name: Build, smoke, deploy

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  build-and-smoke:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Build (icons + tsc + vite)
        run: npm run build

      - name: Install Playwright Chromium
        run: npx playwright install --with-deps chromium

      - name: Install Korean/CJK fonts (rendering parity with target devices)
        run: sudo apt-get update && sudo apt-get install -y fonts-noto-cjk fonts-noto-cjk-extra

      - name: Smoke + audit + feature verification
        run: |
          # Boot vite preview in background and wait for it
          npm run preview -- --host 127.0.0.1 --port 4173 &
          PREVIEW_PID=$!
          for i in $(seq 1 30); do
            if curl -sf http://127.0.0.1:4173/ > /dev/null; then break; fi
            sleep 1
          done
          BASE=http://127.0.0.1:4173 node scripts/smoke-themes.mjs
          BASE=http://127.0.0.1:4173 node scripts/audit-stress.mjs
          BASE=http://127.0.0.1:4173 node scripts/verify-features.mjs
          BASE=http://127.0.0.1:4173 node scripts/verify-themes.mjs
          BASE=http://127.0.0.1:4173 node scripts/verify-pwa.mjs
          BASE=http://127.0.0.1:4173 node scripts/verify-legibility.mjs
          kill $PREVIEW_PID 2>/dev/null || true

      - name: Upload smoke artifacts
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: smoke-screenshots
          path: scripts/.smoke-out/
          if-no-files-found: ignore
          retention-days: 14

      - uses: actions/configure-pages@v5

      - uses: actions/upload-pages-artifact@v3
        with:
          path: dist

  deploy:
    needs: build-and-smoke
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v4
